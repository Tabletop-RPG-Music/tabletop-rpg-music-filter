name: Release module

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg dl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip" \
             '.version = $v | .download = $dl' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module.zip (module.json at zip root)
        run: zip -r module.zip module.json README.md scripts templates styles

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
